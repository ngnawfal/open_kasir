services:
  backend:
    build: ./backend-go
    container_name: kasir-backend
    ports:
      - "8765:8000"
    volumes:
      - ./backend-go/data:/app/data
      - ./backend-go/uploads:/app/uploads
    environment:
      - PORT=8000
      - DB_PATH=data/kasir.db
      - UPLOAD_DIR=uploads
    restart: unless-stopped
    networks:
      - kasir-network

  frontend:
    build: ./frontend
    container_name: kasir-frontend
    ports:
      - "3456:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kasir-network

networks:
  kasir-network:
    driver: bridge
